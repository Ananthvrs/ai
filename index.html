<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTV Style IPTV Player</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for streaming .m3u8 links -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Custom scrollbar for channel list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white font-black px-3 py-1 rounded text-xl tracking-wider shadow">JioTV</div>
            <span class="text-sm text-gray-400 font-medium hidden sm:inline">Tamil IPTV Player</span>
        </div>
        <div class="w-full max-w-md mx-4">
            <input type="text" id="searchInput" placeholder="Search channels..." 
                class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg px-4 py-2 focus:outline-none focus:border-red-500 text-gray-200 placeholder-gray-400 transition">
        </div>
        <div id="channelCount" class="text-xs bg-gray-800 text-gray-300 px-3 py-1 rounded-full border border-gray-700">
            Loading...
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Video Player Section -->
        <main class="flex-1 flex flex-col bg-black relative">
            <div class="flex-1 flex items-center justify-center relative overflow-hidden">
                <video id="videoPlayer" controls autoplay class="w-full h-full max-h-full object-contain bg-black"></video>
                <!-- Loading / Placeholder Overlay -->
                <div id="playerOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 text-gray-400 z-10 transition-opacity">
                    <svg class="w-16 h-16 mb-3 text-red-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-lg font-medium">Select a channel from the list to start watching</p>
                </div>
            </div>
            <!-- Current Playing Info Banner -->
            <div class="bg-gray-900 border-t border-gray-800 px-6 py-4 flex items-center justify-between shrink-0">
                <div>
                    <h2 id="currentChannelName" class="text-lg font-bold text-white">No Channel Selected</h2>
                    <p id="currentChannelCategory" class="text-xs text-gray-400">Live Stream</p>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-600 animate-ping"></span>
                    <span class="text-xs font-semibold text-red-500 uppercase tracking-wider">Live</span>
                </div>
            </div>
        </main>

        <!-- Channel Sidebar -->
        <aside class="w-80 md:w-96 bg-gray-900 border-l border-gray-800 flex flex-col shrink-0">
            <!-- Categories Filter -->
            <div id="categoryContainer" class="flex gap-2 p-3 overflow-x-auto border-b border-gray-800 bg-gray-950 shrink-0">
                <button class="category-btn active bg-red-600 text-white text-xs px-3 py-1.5 rounded-full font-medium shrink-0 transition" data-category="All">All</button>
            </div>
            <!-- Channel List -->
            <div id="channelList" class="flex-1 overflow-y-auto divide-y divide-gray-800/50">
                <!-- Channels will be injected here -->
                <div class="p-6 text-center text-gray-500 text-sm">Fetching playlist...</div>
            </div>
        </aside>
    </div>

    <!-- Application Script -->
    <script>
        const M3U_URL = 'https://iptv-org.github.io/iptv/languages/tam.m3u';
        let channels = [];
        let currentCategory = 'All';

        const video = document.getElementById('videoPlayer');
        const playerOverlay = document.getElementById('playerOverlay');
        const channelListEl = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const channelCountEl = document.getElementById('channelCount');
        const currentChannelNameEl = document.getElementById('currentChannelName');
        const currentChannelCategoryEl = document.getElementById('currentChannelCategory');
        const categoryContainer = document.getElementById('categoryContainer');

        let hls = null;

        // Fetch and parse M3U playlist
        async function loadPlaylist() {
            try {
                // Using a CORS proxy if direct fetch fails due to CORS policies
                const response = await fetch(M3U_URL);
                const text = await response.text();
                channels = parseM3U(text);
                
                channelCountEl.textContent = `${channels.length} Channels`;
                buildCategories();
                renderChannels(channels);
            } catch (error) {
                console.error("Error loading playlist:", error);
                channelListEl.innerHTML = `<div class="p-6 text-center text-red-400 text-sm">Failed to load channels. Please check your network connection or CORS settings.</div>`;
            }
        }

        // Simple M3U Parser
        function parseM3U(data) {
            const lines = data.split('\n');
            const parsedChannels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    // Extract attributes
                    const tvgLogoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const nameMatch = line.match(/,(.+)$/);

                    currentChannel.logo = tvgLogoMatch ? tvgLogoMatch[1] : '';
                    currentChannel.group = groupMatch ? groupMatch[1] : 'General';
                    currentChannel.name = nameMatch ? nameMatch[1].trim() : 'Unknown Channel';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        parsedChannels.push(currentChannel);
                    }
                }
            }
            return parsedChannels;
        }

        // Build category buttons dynamically
        function buildCategories() {
            const categories = ['All', ...new Set(channels.map(c => c.group))];
            categoryContainer.innerHTML = '';
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn text-xs px-3 py-1.5 rounded-full font-medium shrink-0 transition ${cat === 'All' ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`;
                btn.textContent = cat;
                btn.dataset.category = cat;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.replace('bg-red-600', 'bg-gray-800'));
                    btn.classList.replace('bg-gray-800', 'bg-red-600');
                    currentCategory = cat;
                    filterChannels();
                });
                categoryContainer.appendChild(btn);
            });
        }

        // Render channel items into the sidebar
        function renderChannels(channelsToRender) {
            channelListEl.innerHTML = '';
            if (channelsToRender.length === 0) {
                channelListEl.innerHTML = `<div class="p-6 text-center text-gray-500 text-sm">No channels found</div>`;
                return;
            }

            channelsToRender.forEach((channel, index) => {
                const item = document.createElement('div');
                item.className = 'flex items-center space-x-3 p-3 hover:bg-gray-800/60 cursor-pointer transition group';
                item.innerHTML = `
                    <div class="w-10 h-10 bg-gray-800 rounded-lg flex items-center justify-center shrink-0 overflow-hidden border border-gray-700">
                        ${channel.logo ? `<img src="${channel.logo}" alt="" class="w-full h-full object-contain" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%236b7280\' stroke-width=\'2\'><path d=\'M6 2h12v20H6z\'/><path d=\'M9 6h6M9 10h6\'/></svg>'">` : 
                        `<svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-200 truncate group-hover:text-red-400 transition">${channel.name}</p>
                        <p class="text-xs text-gray-400 truncate">${channel.group}</p>
                    </div>
                `;
                item.addEventListener('click', () => playChannel(channel));
                channelListEl.appendChild(item);
            });
        }

        // Play selected channel stream
        function playChannel(channel) {
            currentChannelNameEl.textContent = channel.name;
            currentChannelCategoryEl.textContent = channel.group;
            playerOverlay.style.opacity = '0';
            setTimeout(() => playerOverlay.style.display = 'none', 300);

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        }

        // Filter by category and search input
        function filterChannels() {
            const query = searchInput.value.toLowerCase();
            const filtered = channels.filter(channel => {
                const matchesCategory = currentCategory === 'All' || channel.group === currentCategory;
                const matchesSearch = channel.name.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            renderChannels(filtered);
        }

        searchInput.addEventListener('input', filterChannels);

        // Initialize playlist load on startup
        loadPlaylist();
    </script>
</body>
</html>
